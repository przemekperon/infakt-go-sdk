version: "2"
run:
  timeout: 5m
linters:
  enable:
    - bodyclose
    - misspell
    - unconvert
    - unparam
  settings:
    misspell:
      locale: US
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/przemekperon/infakt-go-sdk
